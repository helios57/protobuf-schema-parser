asyncapi: 2.0.0
info:
  title: Example weakly importing a proto file that cannot be resolved
  version: '1.0.0'
channels:
  mychannel:
    publish:
      message:
        $ref: '#/components/messages/testMessage'

components:
  messages:
    testMessage:
      schemaFormat: 'application/vnd.google.protobuf;version=3'
      payload: |
        syntax = "proto3";

        import weak "some/unknown/dependency.proto";

        // A message that does not use anything of its weak import
        message WeakImporter {
            // The name of the importer.
            optional string name = 1;
        }
