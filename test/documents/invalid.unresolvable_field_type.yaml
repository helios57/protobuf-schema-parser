asyncapi: 2.0.0
info:
  title: Example referencing a message type that is not defined
  version: '1.0.0'
channels:
  mychannel:
    publish:
      message:
        $ref: '#/components/messages/testMessage'

components:
  messages:
    testMessage:
      schemaFormat: 'application/vnd.google.protobuf;version=3'
      payload: |
        syntax = "proto3";

        message Referencing {
            optional MissingType missing = 1;
        }
